<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tommy Deng</title>
<meta name="description" content="Tommy Deng 的个人主页。">
<style>
:root {
  --bg:#edf0f2; --ink:#14202b; --muted:#566470; --line:#c6cfd6; --accent:#1f5eff; --mark:#bcd0ff;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",Georgia,serif;
  --sans:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei","Segoe UI",sans-serif;
}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10161c;--ink:#e6ebef;--muted:#93a0ab;--line:#2b3640;--accent:#86a8ff;--mark:#243a73}
}
:root[data-theme="dark"]{--bg:#10161c;--ink:#e6ebef;--muted:#93a0ab;--line:#2b3640;--accent:#86a8ff;--mark:#243a73}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.wrap{max-width:44rem;margin:0 auto;padding:0 1.5rem}

header.top{padding:clamp(4rem,14vh,9rem) 0 3rem}
h1{font:700 clamp(3.4rem,15vw,7.5rem)/1 var(--serif);letter-spacing:-.03em;margin:0 0 1.75rem}
h1 span{background:linear-gradient(var(--mark),var(--mark)) no-repeat 0 92%/100% .22em;animation:draw 1s .2s ease-out both}
@keyframes draw{from{background-size:0 .22em}to{background-size:100% .22em}}
.lead{font-size:1.2rem;max-width:30rem;margin:0;color:var(--muted)}
nav{display:flex;gap:1.5rem;margin-top:2rem;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;border-bottom:2px solid var(--line);padding-bottom:2px}
nav a:hover{border-color:var(--accent)}

section{padding:3rem 0;border-top:1px solid var(--line)}
h2{font:600 1.5rem/1.3 var(--serif);margin:0 0 1.5rem}
h3{margin:0;font-size:1.1rem;font-weight:600}
p{margin:0 0 1rem;max-width:36rem}
.muted,.tags{color:var(--muted)}
.tags{font-size:.9rem}



dl{display:grid;grid-template-columns:5rem 1fr;gap:.5rem 1rem;margin:0}
dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere}

footer{padding:2.5rem 0 4rem;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
button.theme{font:inherit;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:.2rem .9rem;cursor:pointer}
button.theme:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}h1 span{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><span>Tommy Deng</span></h1>
    <p class="lead">写代码，做小工具，学 AI。这里是我的个人主页。</p>
    <nav aria-label="页面导航">
      <a href="#about">关于我</a>
      <a href="#contact">联系方式</a>
    </nav>
  </header>



  <section id="about">
    <h2>关于我</h2>
    <p>我是 Tommy Deng。我正在按一份 24 周的路线重新系统地学习 AI：从 Python 和数学基础开始，经过机器学习、深度学习，再到大语言模型和智能体。每一周都配代码练习，一边学一边写。</p>
  </section>

  <section id="contact">
    <h2>联系方式</h2>
    <dl>
      <dt>GitHub</dt><dd><a href="https://github.com/TommyDeng">github.com/TommyDeng</a></dd>
      <dt>邮箱</dt><dd><a href="mailto:reget@sohu.com">reget@sohu.com</a></dd>
    </dl>
  </section>
</div>

<footer>
  <div class="wrap">
    <span>© <span id="y">2026</span> Tommy Deng</span>
    <button class="theme" id="theme" type="button" aria-label="切换浅色或深色主题">切换主题</button>
  </div>
</footer>

<script>
document.getElementById("y").textContent=new Date().getFullYear();
(function(){
  var r=document.documentElement,k="site-theme";
  try{var s=localStorage.getItem(k);if(s)r.setAttribute("data-theme",s)}catch(e){}
  document.getElementById("theme").addEventListener("click",function(){
    var d=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);
    var n=d?"light":"dark";r.setAttribute("data-theme",n);
    try{localStorage.setItem(k,n)}catch(e){}
  });
})();
</script>
</body>
</html>
