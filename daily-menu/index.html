<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>日常菜单</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3efe6;
    --surface: #fffdf8;
    --ink: #221e18;
    --muted: #6f675c;
    --line: #e4dccb;
    --accent: #9d3418;
    --accent-ink: #fffaf6;
    --never: #9d3418;
    --today: #246246;
    --shadow: 0 8px 24px rgba(48, 32, 12, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #16130f;
      --surface: #221e19;
      --ink: #f3efe6;
      --muted: #b3aa9e;
      --line: #3a332b;
      --accent: #e07a55;
      --accent-ink: #1a100c;
      --never: #f0a080;
      --today: #8dceab;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 system-ui, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  main {
    width: min(40rem, 100%);
    margin: 0 auto;
    padding: 20px 16px 128px;
  }
  h1, h2 { font-weight: 650; letter-spacing: 0; }
  h1 { margin: 0 0 6px; font-size: 1.7rem; }
  h2 { margin: 0; font-size: 1.05rem; }
  p { margin: 0; }
  .lede { color: var(--muted); margin-bottom: 14px; }
  header { margin-bottom: 18px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, input, select, textarea {
    font: inherit;
    color: inherit;
  }
  input, select, textarea {
    width: 100%;
    min-height: 44px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }
  textarea { min-height: 7rem; resize: vertical; }
  button {
    min-height: 44px;
    padding: 0 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: transparent;
  }
  button.danger { color: var(--accent); }
  button.small { min-height: 36px; padding: 0 10px; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  #status {
    min-height: 1.45em;
    color: var(--muted);
    margin: 8px 0 0;
  }
  section {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px;
    margin: 12px 0;
    box-shadow: var(--shadow);
  }
  .section-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    margin-bottom: 10px;
  }
  .section-head input { max-width: 11rem; }
  form.stack, .stack { display: grid; gap: 8px; }
  .split { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 520px) {
    .split { grid-template-columns: 1fr; }
  }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); }
  .dish, .record, .quiet {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 12px 2px;
    border-top: 1px solid var(--line);
  }
  .quiet { color: var(--muted); display: block; }
  .check { display: flex; gap: 10px; flex: 1; min-width: 0; cursor: pointer; }
  .check input { width: 1.25rem; height: 1.25rem; margin-top: 3px; accent-color: var(--accent); }
  .body { flex: 1; min-width: 0; }
  .name { font-weight: 650; overflow-wrap: anywhere; }
  .check .body, .dish > .body { display: flex; flex-direction: column; gap: 2px; }
  label.field { display: grid; gap: 4px; color: var(--muted); font-size: 0.92rem; }
  .note, .meta { color: var(--muted); font-size: 0.92rem; }
  .meta.never { color: var(--never); }
  .meta.today { color: var(--today); }
  .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .edit-grid { display: grid; gap: 8px; }
  .history-day { margin-top: 12px; }
  .history-day h3 { margin: 0; font-size: 0.95rem; font-weight: 650; }
  .record { flex-wrap: wrap; }
  .record .body { padding-top: 6px; }
  .record input[type="date"] { width: auto; min-height: 36px; flex: 1 1 10rem; }
  .bar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .bar-inner {
    width: min(40rem, 100%);
    margin: 0 auto;
    display: flex;
    gap: 8px;
    align-items: end;
    flex-wrap: wrap;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .bar label { flex: 1 1 9rem; display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); }
  .bar .primary { flex: 2 1 10rem; }
  .help { color: var(--muted); font-size: 0.92rem; display: grid; gap: 6px; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>日常菜单</h1>
    <p class="lede">未停用的菜按最久没做排在前面。勾选今天要做的，确认后才记一笔。</p>
    <p id="status" role="status"></p>
    <p id="sync" class="note"></p>
    <details>
      <summary>同步设置（GitHub）</summary>
      <form id="gh-form" class="stack" style="margin-top:8px">
        <input id="gh-repo" placeholder="数据仓库，例如 TommyDeng/menu-data" autocomplete="off" required>
        <input id="gh-token" type="password" placeholder="访问令牌（只存在这台设备）" autocomplete="off">
        <div class="row">
          <button class="primary" type="submit">保存并连接</button>
          <button type="button" id="gh-off">断开</button>
        </div>
      </form>
    </details>
  </header>

  <section>
    <h2>添加</h2>
    <form id="add-form" class="stack" style="margin-top:10px">
      <input name="name" maxlength="40" placeholder="菜名" autocomplete="off" required>
      <input name="note" maxlength="80" placeholder="备注，可选" autocomplete="off">
      <label class="field">上次做过，可空
        <input name="last" type="date">
      </label>
      <button class="primary" type="submit">添加</button>
    </form>
    <details>
      <summary>一次加多道</summary>
      <div class="stack" style="margin-top:8px">
        <textarea id="bulk" placeholder="一行一个菜名"></textarea>
        <button type="button" id="bulk-add">添加这些</button>
      </div>
    </details>
  </section>

  <section>
    <div class="section-head">
      <h2 id="active-title">推荐</h2>
      <input id="filter" placeholder="筛选菜名" autocomplete="off">
    </div>
    <div id="active"></div>
  </section>

  <section id="disabled-section" hidden>
    <h2>已停用</h2>
    <div id="disabled"></div>
  </section>

  <section>
    <h2>使用记录</h2>
    <form id="backfill" class="stack" style="margin-top:10px">
      <div class="split">
        <select id="backfill-dish" required>
          <option value="">选择菜</option>
        </select>
        <input id="backfill-date" type="date" required>
      </div>
      <button type="submit">补记</button>
    </form>
    <div id="history"></div>
  </section>
</main>

<div class="bar">
  <div class="bar-inner">
    <label>使用日期
      <input id="use-date" type="date" required>
    </label>
    <button type="button" id="clear-checks" class="small" hidden>清空</button>
    <button type="button" id="confirm" class="primary" disabled>先勾选要做的菜</button>
  </div>
</div>

<script>
const STORAGE_KEY = "daily-menu-v1";

let state = { dishes: [], records: [] };
let storageLocked = false;
let stamp = 0;

function timestamp() {
  const now = Date.now();
  stamp = Math.max(stamp + 1, now);
  return new Date(stamp).toISOString();
}
const checked = new Set();
let editingId = null;
let pendingDeleteRecordId = null;
let armTimer = 0;

const $ = (sel) => document.querySelector(sel);

function uid() {
  try {
    if (typeof crypto.randomUUID === "function") return crypto.randomUUID();
  } catch (err) { /* file:// 下有的浏览器不给用 */ }
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (c) => {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function today() {
  const d = new Date();
  const z = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate());
}

function isValidDate(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
}

function isFuture(iso) {
  return iso > today();
}

function normalizeName(value) {
  return String(value || "").normalize("NFC").replace(/\u3000/g, " ").trim().replace(/\s+/g, " ");
}

function setStatus(text) {
  $("#status").textContent = text || "";
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (err) {
    setStatus("这个浏览器不让存数据，改动不会保留。");
    return;
  }
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    const parsed = normalizePayload(data);
    if (parsed.error) throw new Error(parsed.error);
    state = { dishes: parsed.dishes, records: parsed.records };
  } catch (err) {
    storageLocked = true;
    setStatus("这台浏览器里的菜单读不出来，已停止写入，原数据还在。" + err.message);
  }
}

function save() {
  if (!storageLocked) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, dishes: state.dishes, records: state.records }));
    } catch (err) {
      if (!col) setStatus("这台浏览器没有把菜单存下来。" + err.message);
    }
  } else if (!col) {
    setStatus("旧数据读不出来，没有写入。");
  }
  push();
}

// ---- GitHub 同步：数据存在一个仓库的 menu.json 里 ----
const GH_KEY = "daily-menu-gh";
const GH_FILE = "menu.json";
const SYNC_OK = "已同步到 GitHub，别的设备打开页面就能看到。";
const SYNC_LOCAL = "数据只保存在这台设备的浏览器里，不会同步到其他设备。";
let col = null;            // 配置好同步后是 {repo, token}
let ghSha = null, pushTimer = 0, busy = false, dirty = false;

function setSync(text) { $("#sync").textContent = text; }

function ghCfg() {
  try {
    const c = JSON.parse(localStorage.getItem(GH_KEY) || "null");
    return c && c.repo && c.token ? c : null;
  } catch (err) { return null; }
}

function ghFetch(method, body) {
  const headers = {
    Accept: "application/vnd.github+json",
    Authorization: "Bearer " + col.token,
    "X-GitHub-Api-Version": "2022-11-28"
  };
  if (body) headers["Content-Type"] = "application/json";
  return fetch("https://api.github.com/repos/" + col.repo + "/contents/" + GH_FILE, {
    method, headers, cache: "no-store", body: body ? JSON.stringify(body) : undefined
  });
}

function ghError(res) {
  if (res.status === 401) return "令牌无效或已过期";
  if (res.status === 403) return "没有权限或请求太频繁";
  return "GitHub 返回 " + res.status;
}

function b64enc(text) {
  let bin = "";
  new TextEncoder().encode(text).forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin);
}

function b64dec(b64) {
  const bin = atob(b64.replace(/\s/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}

function applyRemote(p) {
  state = { dishes: p.dishes, records: p.records };
  for (const id of [...checked]) if (!dishById(id)) checked.delete(id);
  if (editingId && !dishById(editingId)) editingId = null;
  if (editingId) { renderDisabled(); renderHistory(); renderBackfill(); } else renderDishViews();
  updateBar();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, dishes: state.dishes, records: state.records }));
  } catch (err) { /* 本机缓存失败不影响同步 */ }
}

async function pull() {
  if (!col || busy) return;
  busy = true;
  try {
    const res = await ghFetch("GET");
    if (res.status === 404) {
      ghSha = null;                                   // 仓库里还没有数据文件
      if (state.dishes.length || state.records.length) dirty = true;
      setSync(SYNC_OK);
    } else if (!res.ok) {
      throw new Error(ghError(res));
    } else {
      const j = await res.json();
      ghSha = j.sha;
      const p = normalizePayload(JSON.parse(b64dec(j.content)));
      if (p.error) throw new Error("数据文件格式不对：" + p.error);
      if (!dirty) applyRemote(p);                     // 本机有没上传的改动时，不覆盖
      setSync(SYNC_OK);
    }
  } catch (err) {
    setSync("同步失败：" + err.message + "。先用本机数据，稍后重试。");
  } finally {
    busy = false;
    if (dirty) flush();
  }
}

async function flush() {
  if (!col || busy || !dirty) return;
  busy = true;
  dirty = false;
  let conflict = false;
  try {
    const body = {
      message: "update menu",
      content: b64enc(JSON.stringify({ version: 1, dishes: state.dishes, records: state.records }, null, 1))
    };
    if (ghSha) body.sha = ghSha;
    const res = await ghFetch("PUT", body);
    if (res.status === 409 || res.status === 422) {
      conflict = true;
    } else if (!res.ok) {
      throw new Error(ghError(res));
    } else {
      ghSha = (await res.json()).content.sha;
      setSync(SYNC_OK);
    }
  } catch (err) {
    dirty = true;
    setSync("同步失败：" + err.message + "。改动还在这台设备上，下次操作会重试。");
  } finally {
    busy = false;
  }
  if (conflict) {
    await pull();
    setStatus("别的设备刚改过，已刷新成最新。刚才那次操作没有保存，请再做一次。");
  }
}

function push() {
  if (!col) return;
  dirty = true;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(flush, 700);
}

function startSync() {
  const cfg = ghCfg();
  if (cfg) {
    $("#gh-repo").value = cfg.repo;
    $("#gh-token").placeholder = "令牌已保存，不用重填";
    col = cfg;
    setSync("正在同步…");
    pull();
  } else {
    setSync(SYNC_LOCAL);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
}

$("#gh-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const repo = $("#gh-repo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\.git$/, "");
  const old = ghCfg();
  const token = $("#gh-token").value.trim() || (old ? old.token : "");
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) return setStatus("仓库写成 用户名/仓库名，并填上令牌。");
  setStatus("正在检查…");
  let info;
  try {
    const res = await fetch("https://api.github.com/repos/" + repo, {
      headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + token }
    });
    if (!res.ok) return setStatus(res.status === 401 ? "令牌无效或已过期。" : "访问不了这个仓库，检查仓库名和令牌权限。");
    info = await res.json();
  } catch (err) {
    return setStatus("连不上 GitHub：" + err.message);
  }
  if (info.permissions && !info.permissions.push) return setStatus("这个令牌没有写入权限，需要 Contents 的读写。");
  try {
    localStorage.setItem(GH_KEY, JSON.stringify({ repo, token }));
  } catch (err) {
    return setStatus("这台浏览器没法保存同步设置。");
  }
  col = { repo, token };
  ghSha = null;
  $("#gh-token").value = "";
  $("#gh-token").placeholder = "令牌已保存，不用重填";
  setStatus(info.private ? "已连接。" : "已连接，但这个仓库是公开的，菜单数据所有人都能看到。");
  setSync("正在同步…");
  pull();
});

$("#gh-off").addEventListener("click", () => {
  try { localStorage.removeItem(GH_KEY); } catch (err) { /* 忽略 */ }
  col = null;
  clearTimeout(pushTimer);
  dirty = false;
  $("#gh-token").placeholder = "访问令牌（只存在这台设备）";
  setSync(SYNC_LOCAL);
  setStatus("已断开同步，数据继续保存在本机。");
});

function normalizePayload(data) {
  if (!data || typeof data !== "object" || !Array.isArray(data.dishes) || !Array.isArray(data.records)) {
    return { error: "文件里没有菜品和记录。" };
  }
  const ids = new Set();
  const names = new Set();
  const dishes = [];
  data.dishes.forEach((d, i) => {
    if (!d || typeof d !== "object") return;
    const id = typeof d.id === "string" && d.id ? d.id : "";
    const name = normalizeName(d.name);
    if (!id || !name) return;
    if (ids.has(id) || names.has(name) || name.length > 40) return;
    ids.add(id);
    names.add(name);
    const createdAt = typeof d.createdAt === "string" && d.createdAt
      ? d.createdAt
      : new Date(Date.now() + i).toISOString();
    dishes.push({
      id,
      name,
      note: String(d.note || "").trim().slice(0, 80),
      disabled: Boolean(d.disabled),
      createdAt
    });
  });
  if (dishes.length !== data.dishes.length) return { error: "有菜名空了、太长、重复，或缺少 id。" };

  const recordIds = new Set();
  const pairs = new Set();
  const records = [];
  for (const r of data.records) {
    if (!r || typeof r.id !== "string" || !r.id) return { error: "有记录缺少 id。" };
    if (recordIds.has(r.id)) return { error: "记录 id 重复。" };
    if (!ids.has(r.dishId)) return { error: "有记录指向不存在的菜。" };
    if (!isValidDate(r.date) || isFuture(r.date)) return { error: "有记录的日期不对，或在未来。" };
    const pair = r.dishId + "|" + r.date;
    if (pairs.has(pair)) return { error: "同一道菜在同一天有重复记录。" };
    recordIds.add(r.id);
    pairs.add(pair);
    records.push({ id: r.id, dishId: r.dishId, date: r.date });
  }
  return { dishes, records };
}

function findByName(name, exceptId) {
  return state.dishes.find((d) => d.name === name && d.id !== exceptId);
}

function dishById(id) {
  return state.dishes.find((d) => d.id === id);
}

function lastUsed(dishId) {
  let last = null;
  for (const r of state.records) {
    if (r.dishId === dishId && (last === null || r.date > last)) last = r.date;
  }
  return last;
}

function hasRecord(dishId, date) {
  return state.records.some((r) => r.dishId === dishId && r.date === date);
}

function compareActive(a, b) {
  const la = lastUsed(a.id);
  const lb = lastUsed(b.id);
  if (la === null && lb !== null) return -1;
  if (la !== null && lb === null) return 1;
  if (la === null && lb === null && a.createdAt !== b.createdAt) return a.createdAt < b.createdAt ? -1 : 1;
  if (la !== lb) return la < lb ? -1 : 1;
  return a.name.localeCompare(b.name, "zh");
}

function daysAgo(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const [ty, tm, td] = today().split("-").map(Number);
  const a = new Date(y, m - 1, d);
  const b = new Date(ty, tm - 1, td);
  return Math.round((b - a) / 86400000);
}

function formatDay(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const nowY = Number(today().slice(0, 4));
  return y === nowY ? m + "月" + d + "日" : y + "年" + m + "月" + d + "日";
}

function whenLabel(iso) {
  if (!iso) return { text: "从未", kind: "never" };
  const n = daysAgo(iso);
  const when = n === 0 ? "今天" : n === 1 ? "昨天" : n + "天前";
  return { text: formatDay(iso) + " · " + when, kind: n === 0 ? "today" : "" };
}

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value == null || value === false) continue;
    if (key === "class") node.className = value;
    else node.setAttribute(key, value === true ? "" : String(value));
  }
  for (const child of children || []) {
    if (child == null || child === false) continue;
    node.append(child.nodeType ? child : document.createTextNode(String(child)));
  }
  return node;
}

function queryText() {
  return $("#filter").value.trim().toLowerCase();
}

function matches(dish, q) {
  if (!q) return true;
  return (dish.name + " " + dish.note).toLowerCase().includes(q);
}

function renderActive() {
  const q = queryText();
  const dishes = state.dishes.filter((d) => !d.disabled).sort(compareActive);
  const visible = dishes.filter((d) => matches(d, q));
  const hiddenChecked = [...checked].filter((id) => {
    const dish = dishById(id);
    return dish && !dish.disabled && !matches(dish, q);
  }).length;
  $("#active-title").textContent = "推荐 · " + dishes.length;
  const box = $("#active");
  box.replaceChildren();
  if (!dishes.length) {
    box.append(el("p", { class: "quiet" }, [state.dishes.length ? "在用的菜都停用了。" : "还没有菜。先在上面加。"]));
    return;
  }
  if (!visible.length) box.append(el("p", { class: "quiet" }, ["没有匹配的菜。"]));
  for (const dish of visible) {
    if (editingId === dish.id) box.append(renderEditor(dish));
    else box.append(renderActiveRow(dish));
  }
  if (hiddenChecked) {
    box.append(el("p", { class: "quiet" }, ["另有 " + hiddenChecked + " 道已勾选，被筛选藏起来了。确认时仍会计入。"]));
  }
}

function renderActiveRow(dish) {
  const meta = whenLabel(lastUsed(dish.id));
  const input = el("input", { type: "checkbox" });
  input.checked = checked.has(dish.id);
  input.addEventListener("change", () => {
    if (input.checked) checked.add(dish.id);
    else checked.delete(dish.id);
    updateBar();
  });
  const editBtn = el("button", { type: "button", class: "small" }, ["编辑"]);
  editBtn.addEventListener("click", () => {
    checked.delete(dish.id);
    editingId = dish.id;
    renderActive();
    updateBar();
  });
  const disableBtn = el("button", { type: "button", class: "small" }, ["停用"]);
  disableBtn.addEventListener("click", () => {
    dish.disabled = true;
    checked.delete(dish.id);
    editingId = null;
    save();
    renderDishViews();
    updateBar();
    setStatus("已停用「" + dish.name + "」。它不再出现在推荐里。");
  });
  return el("div", { class: "dish" }, [
    el("label", { class: "check" }, [
      input,
      el("span", { class: "body" }, [
        el("span", { class: "name" }, [dish.name]),
        dish.note ? el("span", { class: "note" }, [dish.note]) : null,
        el("span", { class: "meta " + meta.kind }, [meta.text])
      ].filter(Boolean))
    ]),
    el("span", { class: "actions" }, [editBtn, disableBtn])
  ]);
}

function renderEditor(dish) {
  const name = el("input", { maxlength: "40", value: dish.name, "aria-label": "菜名" });
  const note = el("input", { maxlength: "80", value: dish.note, "aria-label": "备注", placeholder: "备注，可选" });
  const saveBtn = el("button", { type: "button", class: "small primary" }, ["保存"]);
  const cancelBtn = el("button", { type: "button", class: "small" }, ["取消"]);
  const deleteBtn = el("button", { type: "button", class: "small danger" }, ["删除"]);
  const saveEdit = () => {
    const nextName = normalizeName(name.value);
    const nextNote = note.value.trim();
    if (!nextName) return setStatus("菜名不能空。");
    if (nextName.length > 40) return setStatus("菜名太长。");
    if (nextNote.length > 80) return setStatus("备注太长。");
    if (findByName(nextName, dish.id)) return setStatus("已经有「" + nextName + "」。");
    dish.name = nextName;
    dish.note = nextNote;
    editingId = null;
    save();
    renderDishViews();
    setStatus("已保存「" + nextName + "」。");
  };
  saveBtn.addEventListener("click", saveEdit);
  name.addEventListener("keydown", (event) => {
    if (event.key === "Enter") saveEdit();
  });
  note.addEventListener("keydown", (event) => {
    if (event.key === "Enter") saveEdit();
  });
  cancelBtn.addEventListener("click", () => {
    editingId = null;
    renderActive();
  });
  deleteBtn.addEventListener("click", () => deleteDish(dish));
  return el("div", { class: "dish" }, [
    el("div", { class: "edit-grid body" }, [
      name,
      note,
      el("span", { class: "actions" }, [saveBtn, cancelBtn, deleteBtn])
    ])
  ]);
}

function renderDisabled() {
  const section = $("#disabled-section");
  const dishes = state.dishes.filter((d) => d.disabled).sort((a, b) => a.name.localeCompare(b.name, "zh"));
  section.hidden = dishes.length === 0;
  const q = queryText();
  const visible = dishes.filter((d) => matches(d, q));
  const box = $("#disabled");
  box.replaceChildren();
  if (!dishes.length) return;
  if (!visible.length) box.append(el("p", { class: "quiet" }, ["没有匹配的停用菜。"]));
  for (const dish of visible) {
    const restoreBtn = el("button", { type: "button", class: "small" }, ["恢复"]);
    const deleteBtn = el("button", { type: "button", class: "small danger" }, ["删除"]);
    restoreBtn.addEventListener("click", () => {
      dish.disabled = false;
      save();
      renderDishViews();
      setStatus("已恢复「" + dish.name + "」。");
    });
    deleteBtn.addEventListener("click", () => deleteDish(dish));
    const meta = whenLabel(lastUsed(dish.id));
    box.append(el("div", { class: "dish" }, [
      el("span", { class: "body" }, [
        el("span", { class: "name" }, [dish.name]),
        dish.note ? el("span", { class: "note" }, [dish.note]) : null,
        el("span", { class: "meta" }, [meta.text])
      ].filter(Boolean)),
      el("span", { class: "actions" }, [restoreBtn, deleteBtn])
    ]));
  }
}

function deleteDish(dish) {
  const n = state.records.filter((r) => r.dishId === dish.id).length;
  const message = n
    ? "删除「" + dish.name + "」？这道菜的 " + n + " 条使用记录也会一起删掉。"
    : "删除「" + dish.name + "」？";
  if (!confirm(message)) return;
  state.dishes = state.dishes.filter((d) => d.id !== dish.id);
  state.records = state.records.filter((r) => r.dishId !== dish.id);
  checked.delete(dish.id);
  if (editingId === dish.id) editingId = null;
  save();
  renderDishViews();
  updateBar();
  setStatus("已删除「" + dish.name + "」。");
}

function renderHistory() {
  const box = $("#history");
  box.replaceChildren();
  if (!state.records.length) {
    box.append(el("p", { class: "quiet" }, ["还没有使用记录。"]));
    return;
  }
  const byDate = new Map();
  const sorted = [...state.records].sort((a, b) => b.date.localeCompare(a.date) || dishName(a.dishId).localeCompare(dishName(b.dishId), "zh"));
  for (const record of sorted) {
    if (!byDate.has(record.date)) byDate.set(record.date, []);
    byDate.get(record.date).push(record);
  }
  for (const [date, records] of byDate) {
    const ago = daysAgo(date);
    const when = ago === 0 ? " · 今天" : ago === 1 ? " · 昨天" : " · " + ago + "天前";
    const group = el("div", { class: "history-day" }, [el("h3", {}, [formatDay(date) + when])]);
    for (const record of records) group.append(renderRecord(record));
    box.append(group);
  }
}

function dishName(id) {
  const dish = dishById(id);
  return dish ? dish.name : "已删除的菜";
}

function renderRecord(record) {
  const date = el("input", { type: "date", max: today(), value: record.date, "aria-label": dishName(record.dishId) + "的使用日期" });
  date.addEventListener("change", () => {
    const next = date.value;
    if (!isValidDate(next) || isFuture(next)) {
      setStatus("日期不对，也不能记未来。");
      renderHistory();
      return;
    }
    if (state.records.some((r) => r.id !== record.id && r.dishId === record.dishId && r.date === next)) {
      setStatus("这道菜在这天已经有记录。");
      renderHistory();
      return;
    }
    record.date = next;
    save();
    renderDishViews();
    setStatus("已改「" + dishName(record.dishId) + "」的使用日期。");
  });
  const armed = pendingDeleteRecordId === record.id;
  const deleteBtn = el("button", { type: "button", class: "small danger" }, [armed ? "确认删除" : "删除"]);
  deleteBtn.addEventListener("click", () => {
    if (pendingDeleteRecordId !== record.id) {
      pendingDeleteRecordId = record.id;
      clearTimeout(armTimer);
      armTimer = setTimeout(() => {
        pendingDeleteRecordId = null;
        renderHistory();
      }, 4000);
      renderHistory();
      return;
    }
    clearTimeout(armTimer);
    pendingDeleteRecordId = null;
    state.records = state.records.filter((r) => r.id !== record.id);
    save();
    renderDishViews();
    setStatus("已删除一条记录。排序已按剩下的最近日期重算。");
  });
  return el("div", { class: "record" }, [
    el("span", { class: "body name" }, [dishName(record.dishId)]),
    date,
    deleteBtn
  ]);
}

function renderBackfill() {
  const sel = $("#backfill-dish");
  const prev = sel.value;
  sel.replaceChildren(el("option", { value: "" }, ["选择菜"]));
  const dishes = [...state.dishes].sort((a, b) => a.name.localeCompare(b.name, "zh"));
  for (const dish of dishes) {
    sel.append(el("option", { value: dish.id }, [dish.disabled ? dish.name + "（已停用）" : dish.name]));
  }
  if ([...sel.options].some((o) => o.value === prev)) sel.value = prev;
  $("#backfill-date").max = today();
}

function renderDishViews() {
  renderActive();
  renderDisabled();
  renderHistory();
  renderBackfill();
}

function updateBar() {
  const count = [...checked].filter((id) => {
    const dish = dishById(id);
    return dish && !dish.disabled;
  }).length;
  const button = $("#confirm");
  button.disabled = count === 0;
  button.textContent = count ? "确认记录 " + count + " 道" : "先勾选要做的菜";
  $("#clear-checks").hidden = count === 0;
  $("#use-date").max = today();
}

function addDish(name, note, date) {
  const clean = normalizeName(name);
  if (!clean) return "菜名不能空。";
  if (clean.length > 40) return "菜名太长。";
  if (note.trim().length > 80) return "备注太长。";
  if (findByName(clean)) return "已经有「" + clean + "」。";
  if (date && (!isValidDate(date) || isFuture(date))) return "上次做过的日期不对，也不能是未来。";
  const dish = {
    id: uid(),
    name: clean,
    note: note.trim(),
    disabled: false,
    createdAt: timestamp()
  };
  state.dishes.push(dish);
  if (date) state.records.push({ id: uid(), dishId: dish.id, date });
  return "";
}

$("#add-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const data = new FormData(event.currentTarget);
  const error = addDish(data.get("name"), data.get("note") || "", data.get("last") || "");
  if (error) return setStatus(error);
  event.currentTarget.reset();
  save();
  renderDishViews();
  setStatus("已添加。");
});

$("#bulk-add").addEventListener("click", () => {
  const lines = $("#bulk").value.split(/\r?\n/).map(normalizeName).filter(Boolean);
  if (!lines.length) return setStatus("先贴上菜名，一行一个。");
  let added = 0;
  const skipped = [];
  for (const name of lines) {
    const error = addDish(name, "", "");
    if (error) skipped.push(name);
    else added += 1;
  }
  if (added) save();
  $("#bulk").value = added ? "" : $("#bulk").value;
  renderDishViews();
  setStatus(skipped.length
    ? "加了 " + added + " 道，跳过：" + skipped.slice(0, 8).join("、") + (skipped.length > 8 ? " 等" : "")
    : "加了 " + added + " 道。");
});

$("#filter").addEventListener("input", () => {
  if (!editingId) renderActive();
  renderDisabled();
});

$("#confirm").addEventListener("click", () => {
  const date = $("#use-date").value;
  if (!isValidDate(date) || isFuture(date)) return setStatus("先选一个今天或更早的日期。");
  let created = 0;
  let existed = 0;
  for (const id of [...checked]) {
    const dish = dishById(id);
    if (!dish || dish.disabled) continue;
    if (hasRecord(id, date)) {
      existed += 1;
      continue;
    }
    state.records.push({ id: uid(), dishId: id, date });
    created += 1;
  }
  checked.clear();
  if (created) save();
  renderDishViews();
  updateBar();
  if (!created && !existed) setStatus("没有可记录的菜。");
  else if (!created) setStatus("这天都已经记过了。");
  else setStatus("已记录 " + created + " 道。" + (existed ? existed + " 道这天已有记录。" : ""));
});

$("#clear-checks").addEventListener("click", () => {
  checked.clear();
  renderActive();
  updateBar();
});

$("#backfill").addEventListener("submit", (event) => {
  event.preventDefault();
  const dishId = $("#backfill-dish").value;
  const date = $("#backfill-date").value;
  if (!dishById(dishId)) return setStatus("先选一道菜。");
  if (!isValidDate(date) || isFuture(date)) return setStatus("补记的日期不对，也不能是未来。");
  if (hasRecord(dishId, date)) return setStatus("这道菜在这天已经有记录。");
  state.records.push({ id: uid(), dishId, date });
  save();
  renderDishViews();
  setStatus("已补记「" + dishName(dishId) + "」。");
});

$("#use-date").value = today();
$("#use-date").max = today();
$("#backfill-date").value = today();
$("#add-form").querySelector("[name=last]").max = today();
let day = today();
function checkDay() {
  const t = today();
  if (t === day) return;
  const use = $("#use-date");
  if (use.value === day) use.value = t;
  day = t;
  $("#backfill-date").max = t;
  $("#add-form").querySelector("[name=last]").max = t;
  renderDishViews();
  updateBar();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkDay(); });
setInterval(checkDay, 60000);
window.addEventListener("storage", (e) => {
  if (e.key !== STORAGE_KEY || col) return;
  load();
  renderDishViews();
  updateBar();
});

setSync(SYNC_LOCAL);
load();
renderDishViews();
updateBar();
startSync();
</script>
</body>
</html>
